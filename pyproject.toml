[project]
name = "datacleaner-env"
version = "1.0.0"
description = "A stateful data cleaning environment for reinforcement learning agents"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
    "openenv-core>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.uv]
package = false